name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests: a new push cancels the old run. main: every run proceeds on its
# own, so one waiting for deploy approval never blocks the next (deploys are
# serialized in deploy.yml instead).
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Non-secret placeholders so env validation passes in jobs that don't talk to a database.
  DATABASE_URL: postgres://crb:crb@localhost:5432/crb
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  # Unit tests, plus database tests against a real Postgres, as in production.
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-alpine3.23
        env:
          POSTGRES_USER: crb
          POSTGRES_PASSWORD: crb
          POSTGRES_DB: crb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crb" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://crb:crb@localhost:5432/crb_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  # Known vulnerabilities in production dependencies. High or critical fails.
  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm audit --prod --audit-level=high

  # Static analysis: registry packs plus the project rules in .semgrep.yml.
  sast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep
        run: >-
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.177.0
          semgrep scan --config .semgrep.yml --config p/typescript --config p/nodejs
          --config p/secrets --metrics=off --error src

  # End-to-end and accessibility tests against a production build.
  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-alpine3.23
        env:
          POSTGRES_USER: crb
          POSTGRES_PASSWORD: crb
          POSTGRES_DB: crb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crb" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://crb:crb@localhost:5432/crb_e2e
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # On main, after every check passes: build and push the app and migrate images,
  # tagged with the commit SHA and latest.
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, dependency-audit, sast, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/migrate:${{ github.sha }}
            ghcr.io/${{ github.repository }}/migrate:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  # Waits for approval on the "production" environment, then rolls the server.
  deploy:
    needs: images
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.sha }}
    secrets: inherit
