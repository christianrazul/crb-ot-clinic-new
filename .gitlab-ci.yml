default:
  image: node:24-bookworm-slim
  interruptible: true
  before_script:
    - corepack enable
    - corepack install
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

variables:
  # Non-secret placeholders so env validation passes. No job here talks to a database.
  DATABASE_URL: postgres://crb:crb@localhost:5432/crb
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere
  NEXT_TELEMETRY_DISABLED: "1"
  HUSKY: "0"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/

stages:
  - check
  - security
  - build
  - e2e
  - release
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

lint:
  stage: check
  script:
    - pnpm lint
    - pnpm format:check

typecheck:
  stage: check
  script:
    - pnpm typecheck

unit-tests:
  stage: check
  # Database tests run against a real Postgres, as in production.
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: crb
    POSTGRES_PASSWORD: crb
    POSTGRES_DB: crb
    TEST_DATABASE_URL: postgres://crb:crb@postgres:5432/crb_test
  script:
    - pnpm test

# Known vulnerabilities in production dependencies. High or critical fails the pipeline.
dependency-audit:
  stage: security
  needs: []
  script:
    - pnpm audit --prod --audit-level=high

# Static analysis: registry packs plus the project rules in .semgrep.yml.
sast:
  stage: security
  needs: []
  image: semgrep/semgrep:1.177.0
  before_script: []
  cache: []
  script:
    - semgrep scan --config .semgrep.yml --config p/typescript --config p/nodejs --config p/secrets
      --metrics=off --error src

build:
  stage: build
  script:
    - pnpm build
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - .pnpm-store/
    - key: next-cache-$CI_COMMIT_REF_SLUG
      paths:
        - .next/cache/
  artifacts:
    paths:
      - .next/standalone/
    expire_in: 1 day

e2e:
  stage: e2e
  needs: []
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/.cache/ms-playwright
    POSTGRES_USER: crb
    POSTGRES_PASSWORD: crb
    POSTGRES_DB: crb
    E2E_DATABASE_URL: postgres://crb:crb@postgres:5432/crb_e2e
  script:
    - pnpm exec playwright install --with-deps chromium
    - pnpm test:e2e
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - .pnpm-store/
    - key: playwright-1.63.0
      paths:
        - .cache/ms-playwright/
  artifacts:
    when: on_failure
    paths:
      - playwright-report/
      - test-results/
    expire_in: 7 days

# Builds and pushes the app and migrate images on the default branch, tagged
# with the commit SHA (and latest).
images:
  stage: release
  image: docker:27.5.1
  services: ["docker:27.5.1-dind"]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  cache: []
  script:
    - docker build --target runner -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker build --target migrate -t "$CI_REGISTRY_IMAGE/migrate:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/migrate:latest" .
    - docker push --all-tags "$CI_REGISTRY_IMAGE"
    - docker push --all-tags "$CI_REGISTRY_IMAGE/migrate"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Manual: copies the stack definition to the VPS and rolls it to this commit.
# Needs CI/CD variables DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (file) and
# DEPLOY_KNOWN_HOSTS, all protected. See docs/deploy.md.
deploy:
  stage: deploy
  image: alpine:3.23.6
  needs: [images]
  environment:
    name: production
    url: https://$DEPLOY_DOMAIN
  before_script:
    - apk add --no-cache openssh-client
    - install -m 600 "$DEPLOY_SSH_KEY" ~/.ssh_key
    - mkdir -p ~/.ssh && echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
  cache: []
  script:
    - export SSH="ssh -i ~/.ssh_key $DEPLOY_USER@$DEPLOY_HOST"
    - scp -i ~/.ssh_key -r docker-compose.prod.yml deploy "$DEPLOY_USER@$DEPLOY_HOST:/srv/crb-ot-clinic/"
    - $SSH "cd /srv/crb-ot-clinic && sed -i 's/^APP_TAG=.*/APP_TAG=$CI_COMMIT_SHA/' .env
      && docker compose -f docker-compose.prod.yml pull app migrate
      && docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
      && docker image prune -f"
    - $SSH "curl -fsS https://\$(grep ^DOMAIN= /srv/crb-ot-clinic/.env | cut -d= -f2)/api/health"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
